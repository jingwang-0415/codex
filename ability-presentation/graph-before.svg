<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="500" viewBox="70 35 1460 500">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="focus" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#111111" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-orange" markerWidth="3" markerHeight="3" refX="2.4" refY="1.5" orient="auto" viewBox="0 0 3 3">
      <path d="M0.4 0.3L2.4 1.5L0.4 2.7" fill="none" stroke="#C7000B" stroke-width="0.45"/>
    </marker>
    <style>
      .f{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}
      .node{font-size:21px;font-weight:600;text-anchor:middle;dominant-baseline:middle}
      .edge{font-size:14px;font-weight:700;text-anchor:middle;fill:#9B0009}
      .arr{fill:none;stroke:#C7000B;stroke-width:3}
      line,path{stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <!-- Edges -->
  <line x1="250" y1="175" x2="250" y2="386" stroke="#C7000B" stroke-width="4"/>
  <line x1="1350" y1="175" x2="1350" y2="386" stroke="#C7000B" stroke-width="4"/>
  <line x1="800" y1="175" x2="800" y2="231" stroke="#C7000B" stroke-width="4"/>
  <line x1="800" y1="325" x2="800" y2="386" stroke="#C7000B" stroke-width="4"/>
  <line x1="375" y1="445" x2="686" y2="445" stroke="#C7000B" stroke-width="4"/>
  <line x1="910" y1="445" x2="1216" y2="445" stroke="#C7000B" stroke-width="4"/>
  <path d="M243 378L250 386L257 378 M1343 378L1350 386L1357 378 M793 223L800 231L807 223 M793 378L800 386L807 378 M678 438L686 445L678 452 M1208 438L1216 445L1208 452" class="arr"/>

  <!-- Edge labels -->
  <text x="340" y="285" class="f edge">HAS_DVERSION</text>
  <text x="1260" y="285" class="f edge">HAS_DVERSION</text>
  <text x="700" y="215" class="f edge">HAS_JVERSION</text>
  <text x="735" y="365" class="f edge">HAS_RUN</text>
  <text x="532" y="414" class="f edge">CONSUMES_BY</text>
  <text x="1065" y="414" class="f edge">PRODUCES</text>

  <!-- Core nodes -->
  <g filter="url(#focus)">
    <rect x="145" y="65" width="210" height="110" rx="55" fill="#C7000B" stroke="#9B0009" stroke-width="3"/>
    <text x="250" y="120" class="f node" fill="#FFFFFF">Dataset A</text>
  </g>
  <g filter="url(#focus)">
    <rect x="675" y="65" width="250" height="110" rx="55" fill="#C7000B" stroke="#9B0009" stroke-width="3"/>
    <text x="800" y="120" class="f node" fill="#FFFFFF">Job</text>
  </g>
  <g filter="url(#focus)">
    <rect x="1245" y="65" width="210" height="110" rx="55" fill="#C7000B" stroke="#9B0009" stroke-width="3"/>
    <text x="1350" y="120" class="f node" fill="#FFFFFF">Dataset B</text>
  </g>

  <!-- Detail nodes -->
  <g filter="url(#shadow)">
    <rect x="125" y="390" width="250" height="110" rx="24" fill="#FFFFFF" stroke="#C7000B" stroke-width="3"/>
    <text x="250" y="435" class="f node" fill="#710006">Dataset</text>
    <text x="250" y="463" class="f node" fill="#710006">Version A</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="690" y="235" width="220" height="90" rx="22" fill="#FFFFFF" stroke="#C7000B" stroke-width="3"/>
    <text x="800" y="280" class="f node" fill="#710006">JobVersion</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="690" y="390" width="220" height="110" rx="24" fill="#FFFFFF" stroke="#C7000B" stroke-width="3"/>
    <text x="800" y="445" class="f node" fill="#710006">JobRun</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1220" y="390" width="260" height="110" rx="24" fill="#FFFFFF" stroke="#C7000B" stroke-width="3"/>
    <text x="1350" y="435" class="f node" fill="#710006">Dataset</text>
    <text x="1350" y="463" class="f node" fill="#710006">Version B</text>
  </g>
</svg>
